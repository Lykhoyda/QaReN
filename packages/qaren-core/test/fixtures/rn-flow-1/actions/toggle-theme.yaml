appId: com.rndevagent.testapp
---
# id: toggle-theme
# intent: Toggle the app theme between Light and Dark via Profile > Settings.
# tags: [settings, theme, toggle]
# mutates: true
# status: active
# enginePin: maestro-runner@1.1.27
- launchApp:
    stopApp: false
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd
- tapOn:
    id: "profile-settings-btn"
- waitForAnimationToEnd
- assertVisible:
    id: "settings-theme-toggle"
- tapOn:
    id: "settings-theme-toggle"
- waitForAnimationToEnd
- assertVisible:
    id: "settings-theme-label"
