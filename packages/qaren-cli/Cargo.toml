[package]
name = "qaren"
version = "1.0.13"
edition = "2021"
description = "QaReN: the QA run owner for React Native apps (provision, walk, record, publish)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[[bin]]
name = "qaren"
path = "src/main.rs"

[lib]
name = "qaren"
path = "src/lib.rs"
