name: Runner artifacts

# Producer for the release trust-root transaction: builds the two runner zips
# and the Apple silicon qaren tarball at the supplied, already
# verified candidate SHA and hands them back as retained run artifacts together
# with the digest and length the producer itself measured. Each tarball embeds a
# runtime manifest of this run's own runner zips; it can never vouch for itself. The caller (trusted release.yml code on main) is the
# only thing that turns those bytes into a release: nothing here uploads to a
# release, pushes a branch, or holds a write credential — checkouts do not
# persist the token and every job runs read-only.
#
# Callable only. Delivery verification and manifest-asset repair live in
# runner-artifacts-sweep.yml, which needs contents: write — a write-requesting
# job in this file would be rejected at startup on every release run, because
# GitHub checks a called workflow's nested-job permissions against the calling
# job and ignores the nested `if:`.

on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA of the verified release candidate to build
        type: string
        required: true
      version:
        description: Plugin version the candidate advertises (names the zips)
        type: string
        required: true
    outputs:
      ios-sha256:
        value: ${{ jobs.build-ios.outputs.sha256 }}
      ios-bytes:
        value: ${{ jobs.build-ios.outputs.bytes }}
      ios-artifact-id:
        value: ${{ jobs.build-ios.outputs.artifact-id }}
      ios-tree:
        value: ${{ jobs.build-ios.outputs.tree }}
      android-sha256:
        value: ${{ jobs.build-android.outputs.sha256 }}
      android-bytes:
        value: ${{ jobs.build-android.outputs.bytes }}
      android-artifact-id:
        value: ${{ jobs.build-android.outputs.artifact-id }}
      android-tree:
        value: ${{ jobs.build-android.outputs.tree }}
      qaren-darwin-arm64-sha256:
        value: ${{ jobs.build-qaren.outputs.darwin-arm64-sha256 }}
      qaren-darwin-arm64-bytes:
        value: ${{ jobs.build-qaren.outputs.darwin-arm64-bytes }}
      qaren-darwin-arm64-artifact-id:
        value: ${{ jobs.build-qaren.outputs.darwin-arm64-artifact-id }}

permissions:
  contents: read

jobs:
  build-ios:
    name: Build rn-fast-runner (iOS)
    # macos-15 ships Xcode 16.x — required since RnFastRunner.xcodeproj moved to
    # project format 77 (Xcode 15.4 on macos-14 refuses to open it). Same runner
    # choice as native-tests.yml and codeql.yml, which build this project green.
    runs-on: macos-15
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
      bytes: ${{ steps.zip.outputs.bytes }}
      tree: ${{ steps.zip.outputs.tree }}
      artifact-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Refuse anything but a full candidate SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            *[!0-9a-f]* | '') echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1 ;;
          esac
          [ "${#REF}" = 40 ] || { echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1; }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: build-for-testing (no code signing, both arches)
        run: |
          xcodebuild build-for-testing \
            -project packages/rn-fast-runner/RnFastRunner/RnFastRunner.xcodeproj \
            -scheme RnFastRunner \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO
      - id: zip
        name: Zip products + xctestrun and record the producer identity
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ] || { echo "::error::checkout is not the candidate $REF" >&2; exit 1; }
          test -n "$(find build/dd/Build/Products -name '*.xctestrun' -print -quit)" \
            || { echo "no .xctestrun produced — unexpected DerivedData layout"; exit 1; }
          ZIP="rn-fast-runner-$VERSION-sim.zip"
          (cd build/dd && zip -r "$GITHUB_WORKSPACE/$ZIP" Build/Products)
          {
            echo "sha256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
            echo "bytes=$(wc -c < "$ZIP" | tr -d ' ')"
            echo "tree=$(git rev-parse HEAD:packages/rn-fast-runner)"
          } >> "$GITHUB_OUTPUT"
      - id: retain
        name: Retain the zip for the release transaction
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 — SHA pin
        with:
          name: rn-fast-runner-${{ inputs.version }}-sim
          path: rn-fast-runner-${{ inputs.version }}-sim.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-android:
    name: Build rn-android-runner (Android)
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.zip.outputs.sha256 }}
      bytes: ${{ steps.zip.outputs.bytes }}
      tree: ${{ steps.zip.outputs.tree }}
      artifact-id: ${{ steps.retain.outputs.artifact-id }}
    steps:
      - name: Refuse anything but a full candidate SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            *[!0-9a-f]* | '') echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1 ;;
          esac
          [ "${#REF}" = 40 ] || { echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1; }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Ubuntu runners ship a JDK (JAVA_HOME set) and the Android SDK
      # ($ANDROID_HOME). If a future AGP needs a newer JDK, add actions/setup-java.
      - name: assembleDebug + assembleDebugAndroidTest
        working-directory: packages/rn-android-runner
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - id: zip
        name: Zip both APKs (flat) and record the producer identity
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ] || { echo "::error::checkout is not the candidate $REF" >&2; exit 1; }
          APP=packages/rn-android-runner/app/build/outputs/apk/debug/app-debug.apk
          TEST=packages/rn-android-runner/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -f "$APP" && test -f "$TEST" || { echo "APK(s) missing after gradle build"; exit 1; }
          ZIP="rn-android-runner-$VERSION.zip"
          zip -j "$ZIP" "$APP" "$TEST"
          {
            echo "sha256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
            echo "bytes=$(wc -c < "$ZIP" | tr -d ' ')"
            echo "tree=$(git rev-parse HEAD:packages/rn-android-runner)"
          } >> "$GITHUB_OUTPUT"
      - id: retain
        name: Retain the zip for the release transaction
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 — SHA pin
        with:
          name: rn-android-runner-${{ inputs.version }}
          path: rn-android-runner-${{ inputs.version }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


  build-qaren:
    name: Build qaren tarball (macOS arm64)
    needs: [build-ios, build-android]
    runs-on: macos-15
    outputs:
      darwin-arm64-sha256: ${{ steps.pack.outputs.darwin-arm64-sha256 }}
      darwin-arm64-bytes: ${{ steps.pack.outputs.darwin-arm64-bytes }}
      darwin-arm64-artifact-id: ${{ steps.retain-arm64.outputs.artifact-id }}
    steps:
      - name: Refuse anything but a full candidate SHA
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            *[!0-9a-f]* | '') echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1 ;;
          esac
          [ "${#REF}" = 40 ] || { echo "::error::candidate ref must be a full commit SHA, got '$REF'" >&2; exit 1; }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 — SHA pin
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — SHA pin
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Rust target for Apple silicon
        run: rustup target add aarch64-apple-darwin
      # Exact producer artifact IDs from this run's own runner jobs.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 — SHA pin
        with:
          artifact-ids: ${{ needs.build-ios.outputs.artifact-id }},${{ needs.build-android.outputs.artifact-id }}
          path: handoff
          merge-multiple: true
      - name: Runtime runner manifest from this run's runner zips
        env:
          VERSION: ${{ inputs.version }}
          IOS_SHA256: ${{ needs.build-ios.outputs.sha256 }}
          IOS_BYTES: ${{ needs.build-ios.outputs.bytes }}
          ANDROID_SHA256: ${{ needs.build-android.outputs.sha256 }}
          ANDROID_BYTES: ${{ needs.build-android.outputs.bytes }}
        run: |
          check() {
            local zip="handoff/$1" sha="$2" bytes="$3" got
            [ -f "$zip" ] || { echo "::error::retained $1 is missing" >&2; exit 1; }
            got=$(shasum -a 256 "$zip" | cut -d' ' -f1)
            [ "$got" = "$sha" ] || { echo "::error::$1: retained sha256 $got != producer $sha" >&2; exit 1; }
            got=$(wc -c < "$zip" | tr -d ' ')
            [ "$got" = "$bytes" ] || { echo "::error::$1: retained length $got != producer $bytes" >&2; exit 1; }
          }
          check "rn-fast-runner-$VERSION-sim.zip" "$IOS_SHA256" "$IOS_BYTES"
          check "rn-android-runner-$VERSION.zip" "$ANDROID_SHA256" "$ANDROID_BYTES"
          node scripts/build-runner-manifest.mts \
            --version "$VERSION" \
            --ios "handoff/rn-fast-runner-$VERSION-sim.zip" \
            --android "handoff/rn-android-runner-$VERSION.zip" \
            --out "$RUNNER_TEMP/runtime-runner-manifest.json"
      - id: pack
        name: Build the arm64 tarball and record the producer identity
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          [ "$(git rev-parse HEAD)" = "$REF" ] || { echo "::error::checkout is not the candidate $REF" >&2; exit 1; }
          PLATFORM=darwin-arm64
          node scripts/build-qaren-tarball.ts --version "$VERSION" --platform "$PLATFORM" \
            --runner-manifest "$RUNNER_TEMP/runtime-runner-manifest.json" --out-dir dist-qaren
          TARBALL="dist-qaren/qaren-$VERSION-$PLATFORM.tar.gz"
          {
            echo "$PLATFORM-sha256=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)"
            echo "$PLATFORM-bytes=$(wc -c < "$TARBALL" | tr -d ' ')"
          } >> "$GITHUB_OUTPUT"
      - name: Smoke the arm64 tarball (extract, architecture, --version)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PLATFORM=darwin-arm64
          DIR="$RUNNER_TEMP/smoke-$PLATFORM"
          mkdir -p "$DIR"
          tar -xzf "dist-qaren/qaren-$VERSION-$PLATFORM.tar.gz" -C "$DIR"
          BIN="$DIR/qaren-$VERSION-$PLATFORM/bin/qaren"
          ARCH=arm64
          [ "$(lipo -archs "$BIN")" = "$ARCH" ] || { echo "::error::$PLATFORM binary is $(lipo -archs "$BIN"), expected $ARCH" >&2; exit 1; }
          GOT=$(env -u QAREN_RUNTIME "$RUNNER_TEMP/smoke-darwin-arm64/qaren-$VERSION-darwin-arm64/bin/qaren" --version)
          [ "$GOT" = "qaren $VERSION" ] || { echo "::error::qaren --version printed '$GOT', expected 'qaren $VERSION'" >&2; exit 1; }
      - id: retain-arm64
        name: Retain the arm64 tarball for the release transaction
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 — SHA pin
        with:
          name: qaren-${{ inputs.version }}-darwin-arm64
          path: dist-qaren/qaren-${{ inputs.version }}-darwin-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
