name: Bug report
description: Something in QaReN did not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Inside your agent, `/qaren:feedback` can draft this for you.
        Do not paste screenshots, videos, typed values or `.qaren/config.yaml` values unless you have checked they hold no private data.
        Report security problems privately through [SECURITY.md](https://github.com/Lykhoyda/QaReN/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or agent request you ran, and the plan if it is safe to share.
      placeholder: |
        1. qaren check --plan-file plan.md
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: receipt
    attributes:
      label: Run details
      description: From the receipt `qaren check` or `qaren pr` printed, if the report is about a run.
      placeholder: |
        result:
        run_id:
        failure.code:
        failure.next_action:
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: First line of each command's output. Write "missing" for a command that fails.
      placeholder: |
        qaren --version:
        sw_vers -productVersion:
        xcodebuild -version:
        node --version:
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Logs, a workaround, or how often it happens.
