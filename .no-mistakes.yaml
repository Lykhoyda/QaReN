# Pin local no-mistakes lint and format to this repo's oxlint/oxfmt scripts.
# Keep commands.test absent so the pipeline does not override the default test path.
commands:
  lint: yarn lint
  format: yarn format

# Test agents never see real simulators; a run that needs real devices bypasses the wrapper under explicit human control.
test:
  instructions: |
    Run every qaren, xcrun, simctl, xcodebuild, idb, adb and maestro command, and any script or test that reaches a simulator or emulator, through scripts/qaren-sim-sandbox.sh (for example `scripts/qaren-sim-sandbox.sh qaren check --plan-file plan.md`).
    It runs the command in an isolated HOME with xcrun, simctl, devicectl, xcodebuild, idb and adb shims that show one fake booted iPhone and no Android device and refuse every other device command, and a maestro that reports itself unavailable; export QAREN_SANDBOX_DIR to keep one sandbox across calls, and add scenario-specific shims to its bin/.
    Never list, boot, install on, or drive a real simulator or emulator, and never bypass the shims with an absolute xcrun, simctl, xcodebuild, idb, adb or maestro path. A step that stops because the sandbox has no real device (a `qaren-sim-sandbox:` refused or not-available message, or a refusal for a missing device, adb server or simulator service) is not live-validated: report it as such rather than retrying on a real device. Investigate any other failure as a real test failure.
