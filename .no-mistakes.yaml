# Pin local no-mistakes lint and format to this repo's oxlint/oxfmt scripts.
# Keep commands.test absent so the pipeline does not override the default test path.
commands:
  lint: yarn lint
  format: yarn format

# Test agents never see real simulators: opt in only when the run intent explicitly asks for real devices.
test:
  instructions: |
    Run every qaren, xcrun, simctl, xcodebuild, adb and maestro command, and any script or test that reaches a simulator or emulator, through scripts/qaren-sim-sandbox.sh (for example `scripts/qaren-sim-sandbox.sh qaren check --plan-file plan.md`).
    It runs the command in an isolated HOME with xcrun, xcodebuild and adb shims that show one fake booted iPhone and no Android device, and refuse every other device command; export QAREN_SANDBOX_DIR to keep one sandbox across calls, and add scenario-specific shims to its bin/.
    Never list, boot, install on, or drive a real simulator or emulator, and never bypass the shims with an absolute xcrun, simctl, xcodebuild or adb path. A step stopped by a `qaren-sim-sandbox: refused` message is not live-validated: report it as such rather than retrying on a real device. Any other failure is a real test failure to investigate and report.
    Set QAREN_PIPELINE_REAL_DEVICES=1 only when the run intent explicitly asks for real-device validation.
