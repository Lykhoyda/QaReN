# Install locked workspace dependencies before the oxlint/oxfmt scripts.
# Keep commands.test absent so the pipeline does not override the default test path.
# commands and test.instructions are read from main; changes take effect after develop merges into main.
commands:
  lint: corepack yarn install --immutable && corepack yarn lint
  format: corepack yarn install --immutable && corepack yarn format

# Test agents never see real simulators; a run that needs real devices bypasses the wrapper under explicit human control.
test:
  instructions: |
    Run every qaren, xcrun, simctl, xcodebuild, adb and maestro command, and any script or test that reaches a simulator or emulator, through scripts/qaren-sim-sandbox.sh (for example `scripts/qaren-sim-sandbox.sh qaren check --plan-file plan.md`).
    It runs the command in an isolated HOME with xcrun, simctl, devicectl, xcodebuild and adb shims that show one fake booted iPhone and no Android device and refuse every other device command, and a maestro that reports itself unavailable; export QAREN_SANDBOX_DIR to keep one sandbox across calls, and add scenario-specific shims to its bin/.
    Never list, boot, install on, or drive a real simulator or emulator, and never bypass the shims with an absolute xcrun, simctl, xcodebuild, adb or maestro path. A step that stops because the sandbox has no real device (a `qaren-sim-sandbox:` refused or not-available message, or a refusal for a missing device, adb server or simulator service) is not live-validated: report it as such rather than retrying on a real device. Investigate any other failure as a real test failure.
    Sandbox-only verification is the expected outcome for scenarios that require a real simulator or emulator. Report each such scenario as "not live-validated; covered by device QA after the PR" with severity info and action no-op. Do not raise an ask-user finding or block solely because these scenarios could not be driven live, including when 0 of N scenarios were driven live. Keep sandbox verification evidence separate from live-device acceptance; never report these scenarios as live-validated or PASS.
    Run the relevant hermetic checks that can execute in the sandbox. Actual test failures, failed assertions, and failures unrelated to unavailable real devices remain blocking; do not reclassify them as expected sandbox limitations.

# One automatic review fix round, then the review parks for a decision.
auto_fix:
  review: 1

# review and pr are read only from the default branch's copy of this file, so they take effect once develop merges into main.
review:
  path_instructions:
    - path: "*"
      instructions: |
        Block only on a correctness or security defect that this change introduces and that occurs in its intended use. Report a hypothetical edge case, a defect that predates the change, or an extra guard as an info finding with action no-op, as a follow-up note.
        The integration branch is develop. The develop-to-main migration is not part of this change: do not report findings about it or about files the change did not touch.
pr:
  base_branch: develop
